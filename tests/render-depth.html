<!doctype html>
<meta charset="utf-8">
<title>Voxel renderer tests</title>
<pre id="result">Running...</pre>
<iframe id="game" src="../index.html" width="320" height="240"></iframe>
<script>
  function runTests() {
    const failures = [];
    const assert = (condition, message) => {
      if (!condition) failures.push(message);
    };
    const render = () => rendererState.render();
    const flush = () => { for (let i = 0; i < 20; i++) render(); };
    const chunkKey = (x, z) => `${Math.floor(x / 8)},${Math.floor(z / 8)}`;
    const chunk = (x, z) => rendererState.chunks.get(chunkKey(x, z));
    const originalNow = Date.now;
    frameDeltaMs = 16;
    Date.now = () => 900000;
    flush();
    assert(rendererState.renderer instanceof THREE.WebGLRenderer, "uses Three.js WebGLRenderer");
    assert(rendererState.renderer.shadowMap.enabled, "shadows enabled");
    const mathUtils = THREE.MathUtils;
    THREE.MathUtils = undefined;
    try {
      for (const [width, height] of [[320, 240], [240, 320]]) {
        rendererState.resize(width, height, 1);
        const focalLength = Math.max(1, Math.min(width, height) * 0.55);
        const expectedFov = 2 * Math.atan(height / (2 * focalLength)) * 180 / Math.PI;
        assert(Math.abs(rendererState.view.fov - expectedFov) < 1e-10,
          "resize preserves the vertical field of view without THREE.MathUtils");
        assert(rendererState.view.aspect === width / height,
          "resize updates the camera aspect ratio");
        assert(rendererState.renderer.domElement.width === width &&
          rendererState.renderer.domElement.height === height, "resize updates the drawing buffer");
      }
    } finally {
      THREE.MathUtils = mathUtils;
      resizeCanvas();
    }
    const initial = chunk(0, -10);
    render();
    assert(chunk(0, -10) === initial, "unchanged chunks are reused");

    // At yaw zero the game's +X direction must appear on the right.
    const right = new THREE.Vector3(-1, camera.pos[1] + EYE_HEIGHT, camera.pos[2] + 5)
      .project(rendererState.view);
    assert(right.x > 0, "camera preserves the game's horizontal orientation");

    const x = Math.floor(camera.pos[0]) + 1;
    const z = Math.floor(camera.pos[2]);
    const y = terrainHeight(x, z) + 10;
    const key = blockKey(x, y, z);
    const before = chunk(x, z);
    blockEdits.set(key, { x, y, z, type: "torch", color: ITEM_DEFINITIONS.torch.color });
    flush();
    assert(chunk(x, z) !== before, "block edit rebuilds its chunk");
    assert(chunk(x, z).torches.some(p => p[0] === x + 0.5 && p[1] === y + 0.7),
      "high placed torch is included");
    camera.pos[1] = y;
    flush();
    assert(rendererState.scene.children.some(light => light.isPointLight && light.intensity > 0),
      "nearby torch emits local light");
    const lit = chunk(x, z);
    blockEdits.delete(key);
    flush();
    assert(chunk(x, z) !== lit && chunk(x, z).torches.length === 0,
      "removing a torch updates geometry and lighting");

    const edgeX = Math.floor(x / 8) * 8 + 7;
    const neighborBefore = chunk(edgeX + 1, z);
    const edgeKey = blockKey(edgeX, y, z);
    blockEdits.set(edgeKey, { x: edgeX, y, z, type: "dirt", color: ITEM_DEFINITIONS.dirt.color });
    flush();
    assert(chunk(edgeX + 1, z) !== neighborBefore, "boundary edits rebuild the neighboring chunk");
    blockEdits.delete(edgeKey);
    flush();

    blockEdits.set(key, { x, y, z, type: "crop", color: ITEM_DEFINITIONS.crop.color });
    cropStates.set(key, 0);
    flush();
    const youngCrop = chunk(x, z);
    cropStates.set(key, 7);
    flush();
    assert(chunk(x, z) !== youngCrop, "crop growth rebuilds its geometry");
    cropStates.delete(key);
    blockEdits.delete(key);
    flush();

    const doorColor = doorColorFromState({ open: false, facing: 0, hingeRight: false });
    blockEdits.set(key, { x, y, z, type: "door", color: doorColor });
    flush();
    const closed = chunk(x, z).doors.find(door => door.block.x === x && door.block.y === y);
    assert(Boolean(closed), "door geometry is rendered");
    const oldRotation = closed.mesh.rotation.y;
    blockEdits.set(key, { x, y, z, type: "door",
      color: doorColorFromState({ open: true, facing: 0, hingeRight: false }) });
    flush();
    const opened = chunk(x, z).doors.find(door => door.block.x === x && door.block.y === y);
    assert(Math.abs(opened.mesh.rotation.y - oldRotation) > 1, "door animates after state changes");
    blockEdits.delete(key);
    flush();

    Date.now = () => 0;
    render();
    const night = rendererState.scene.children.find(light => light.isDirectionalLight).intensity;
    Date.now = () => 900000;
    render();
    const day = rendererState.scene.children.find(light => light.isDirectionalLight).intensity;
    assert(day > night, "sunlight changes with time of day");
    Date.now = originalNow;

    // Render intersecting triangles in both orders into a depth-buffered target.
    const renderer = rendererState.renderer;
    const scene = new THREE.Scene();
    const view = new THREE.PerspectiveCamera(90, 1, 0.1, 20);
    const target = new THREE.WebGLRenderTarget(32, 32);
    const makeQuad = points => {
      const geometry = new THREE.BufferGeometry();
      const vertices = [0, 1, 2, 0, 2, 3].flatMap(index => points[index]);
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
      return geometry;
    };
    const red = new THREE.Mesh(makeQuad([
      [-0.5, -0.5, -1], [2.5, -2.5, -5], [2.5, 2.5, -5], [-0.5, 0.5, -1]
    ]), new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide }));
    const blue = new THREE.Mesh(makeQuad([
      [-1.5, -1.5, -3], [1.5, -1.5, -3], [1.5, 1.5, -3], [-1.5, 1.5, -3]
    ]), new THREE.MeshBasicMaterial({ color: 0x0000ff, side: THREE.DoubleSide }));
    const pixel = new Uint8Array(4);
    for (const objects of [[red, blue], [blue, red]]) {
      scene.clear();
      scene.add(...objects);
      renderer.setRenderTarget(target);
      renderer.render(scene, view);
      renderer.readRenderTargetPixels(target, 12, 16, 1, 1, pixel);
      assert(pixel[0] > pixel[2], "near side of intersection is red in either draw order");
      renderer.readRenderTargetPixels(target, 23, 16, 1, 1, pixel);
      assert(pixel[2] > pixel[0], "far side of intersection is blue in either draw order");
    }
    renderer.setRenderTarget(null);
    target.dispose();
    red.geometry.dispose();
    blue.geometry.dispose();
    red.material.dispose();
    blue.material.dispose();
    return failures;
  }

  document.getElementById("game").addEventListener("load", event => {
    const result = document.getElementById("result");
    try {
      const failures = event.target.contentWindow.eval(`(${runTests.toString()})()`);
      result.textContent = failures.length ? `FAIL\n${failures.join("\n")}` : "PASS";
    } catch (error) {
      result.textContent = `FAIL\n${error.stack}`;
    }
  });
</script>
